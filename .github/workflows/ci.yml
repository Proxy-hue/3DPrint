name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend (Django) Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: 3dprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest pytest-django

    - name: Verify key packages are installed
      run: |
        python -c "import gunicorn, trimesh, numpy, structlog, axes, argon2; print('All required packages imported successfully')"

    - name: Lint with flake8
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check for missing migrations
      if: hashFiles('backend/requirements.txt') != ''
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: test-secret
      run: |
        cd backend
        python manage.py makemigrations --check --dry-run

    - name: Run tests with pytest
      env:
        POSTGRES_HOST: localhost
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: test-secret-key-123
      run: |
        cd backend
        pytest

  frontend-ci:
    name: Frontend (React) Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: cd frontend && npm ci

    - name: Build
      run: cd frontend && npm run build