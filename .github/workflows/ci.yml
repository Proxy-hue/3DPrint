name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend (Django) Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Кэширует зависимости для ускорения следующих сборок

    - name: Install dependencies
      # Проверяем, существует ли файл, чтобы пайплайн не падал до появления бэкенда
      if: hashFiles('backend/requirements.txt') != ''
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest pytest-django

    - name: Lint with flake8
      if: hashFiles('backend/requirements.txt') != ''
      run: |
        # Останавливаем сборку, если есть синтаксические ошибки (E9) или неопределенные имена (F82)
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run tests with pytest
      if: hashFiles('backend/requirements.txt') != ''
      run: |
        cd backend
        pytest || [ $& -eq 5 ]

